{% extends "layout.html" %}
{% set active_page = "admin_login" %}

{% block title %}Admin Portal Login{% endblock %}

{% block content %}
<div style="max-width: 480px; margin: 40px auto;">
    <div class="glass-card" style="border-top: 4px solid var(--accent-indigo);">
        <div style="text-align: center; margin-bottom: 24px;">
            <div class="brand-icon" style="margin: 0 auto 12px auto; background: linear-gradient(135deg, var(--accent-indigo), var(--accent-purple));">
                <i class="fa-solid fa-user-shield"></i>
            </div>
            <h2>Admin Portal Login</h2>
            <p style="color: var(--text-muted); font-size: 0.88rem;">System Administrator Access & Governance Panel</p>
        </div>

        <form action="{{ url_for('admin_login') }}" method="POST">
            <div class="form-group">
                <label class="form-label">Admin Username</label>
                <input type="text" name="username" class="form-control" value="admin" placeholder="Enter admin username" required>
            </div>

            <div class="form-group">
                <label class="form-label">Admin Password</label>
                <input type="password" name="password" class="form-control" placeholder="Enter admin password" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 10px; background: linear-gradient(135deg, var(--accent-indigo), #3730a3);">
                <i class="fa-solid fa-shield-halved"></i> Access Admin Console
            </button>
        </form>

        <div style="text-align: center; margin-top: 20px; font-size: 0.85rem; color: var(--text-muted); border-top: 1px solid var(--border-glass); padding-top: 16px;">
            Participant user? <a href="{{ url_for('login') }}">Participant Login here</a>
        </div>
    </div>
</div>
{% endblock %}
